<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>url-shortly</title>
    <link rel="stylesheet" href="/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔗</text></svg>"
    />
  </head>
  <body>
    <div class="page">
      <main class="card">
        <div class="brand">
          <span class="brand-icon" aria-hidden="true">🔗</span>
          <h1>url-shortly</h1>
        </div>
        <p class="subtitle">Paste a long URL, get a short one back.</p>

        <form id="shorten-form">
          <div class="field">
            <input
              type="text"
              id="url-input"
              name="url"
              placeholder="https://example.com/a/very/long/path"
              autocomplete="off"
              inputmode="url"
              required
            />
            <button id="submit-button" type="submit">
              <span class="button-label">Shorten</span>
            </button>
          </div>
        </form>

        <div id="result" class="result" hidden>
          <a id="result-link" class="result-link" href="#" target="_blank" rel="noopener"></a>
          <button id="copy-button" class="copy-button" type="button">Copy</button>
        </div>

        <p id="error" class="error" hidden></p>

        <ul class="features">
          <li>⚡ Instant redirects</li>
          <li>📊 Click tracking</li>
          <li>🔒 Validated links only</li>
        </ul>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
